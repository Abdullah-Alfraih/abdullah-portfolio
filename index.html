<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>

    <a class="brand" href="#home" aria-label="Home"><span>AA</span><strong data-name>Abdullah AlFraih</strong></a>
    <nav id="nav" aria-label="Main navigation"></nav>
    <div class="header-actions">
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch color theme"><span aria-hidden="true">◐</span></button>
      <button class="menu-button" id="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">☰</button>

        <p class="eyebrow" id="hero-eyebrow"></p>
        <h1 id="hero-title"></h1>

    <section class="section" id="education"><div class="section-heading reveal"><p class="section-index">04</p><div><p class="eyebrow" data-section-label="education"></p><h2 id="education-heading"></h2></div></div><div id="education-list"></div></section>
    <section class="section" id="projects"><div class="section-heading reveal"><p class="section-index">05</p><div><p class="eyebrow" data-section-label="projects"></p><h2 id="projects-heading"></h2></div></div><div class="project-grid" id="projects-list"></div></section>
